name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  deskbot-server:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache locked dependencies and language data
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
          key: deskbot-${{ runner.os }}-py311-${{ hashFiles('service/uv.lock') }}

      - name: Install locked package and dev tools
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.22"
          uv sync --locked --extra dev

      - name: Prepare pinned test model
        run: |
          mkdir -p models/silero_vad
          uv run --locked python tools/fetch_test_assets.py

      - name: Ruff
        run: uv run --locked ruff check src tools tests

      - name: Compile all modules
        run: uv run --locked python -m compileall -q src

      - name: Pytest
        run: uv run --locked pytest -q tests
