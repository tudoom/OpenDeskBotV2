; Deskbot v2 ESP32-S3 firmware (XIAO profile retained for compatibility)
; 烧录: ./flash_rom.sh all
;
; USB CDC is the only device/PC data transport.

[platformio]
src_dir = firmware

[env:deskbot_rom_common]
build_flags =
	-DBOARD_HAS_PSRAM

[env:seeed_xiao_esp32s3]
extends = env:deskbot_rom_common
; Pin the Arduino/ESP32 platform and every direct/transitive library.  A clean
; CI build must resolve the same toolchain instead of whatever "latest" means.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions/deskbot_rom_8MB.csv
lib_ldf_mode = deep
extra_scripts =
	pre:scripts/check_usb_boot_contract.py
; These libraries are declared by upstream display-library manifests but are
; not used by Deskbot.  Their Arduino AVR / ESP-IDF parallel-bus sources do
; not support ESP32-S3 on the pinned Arduino 3.x toolchain.
lib_ignore =
	arduino-libraries/SD
	bitbank2/bb_spi_lcd
build_flags =
	${env:deskbot_rom_common.build_flags}
	; Keep the only device/PC transport explicit even if a board manifest changes.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	https://github.com/sh123/esp32_opus_arduino.git#a3816682932b8792f90072ee05c33fe25c055628
	adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit BusIO@1.17.4
	adafruit/Adafruit seesaw Library@1.7.9
	bblanchon/ArduinoJson@7.4.3
	bitbank2/JPEGDEC@1.8.4
	; U8g2_for_Adafruit_GFX vendors the u8g2 font/runtime sources used by
	; display_text.cpp.  Adding standalone U8g2 too links every font twice.
	https://github.com/olikraus/U8g2_for_Adafruit_GFX.git#82d2b3eea866e7d40266672b41e5c8306ee97403

[env:deskbot_v2]
extends = env:seeed_xiao_esp32s3
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
	${env:seeed_xiao_esp32s3.build_flags}
	-DDESKBOT_BOARD_V2=1
	; The production camera module is mounted 180 degrees in the enclosure.
	-DDESKBOT_CAMERA_HMIRROR=1
	-DDESKBOT_CAMERA_VFLIP=1
	; Keep two PSRAM-backed buffers in latest-frame mode.  A single
	; CAMERA_GRAB_WHEN_EMPTY buffer can block a cold one-shot for the driver's
	; full timeout while RTC audio is active, so the vision tool never receives
	; a frame.  V2 has octal PSRAM and already uses PSRAM DMA.
	-DDESKBOT_CAMERA_FB_COUNT=2
	-DDESKBOT_CAMERA_GRAB_LATEST=1
	-DDESKBOT_CAMERA_PSRAM_DMA=1
	; The stream is only a bounded one-shot fallback in normal operation.  Keep
	; it responsive during continuous RTC microphone uplink instead of delaying
	; the first eligible JPEG for up to two seconds.
	-DDESKBOT_CAMERA_UPLINK_INTERVAL_DURING_LISTEN_MS=500

[env:deskbot_v2_low_cost_afe]
extends = env:deskbot_v2
build_flags =
	${env:deskbot_v2.build_flags}
	-DDESKBOT_AFE_LOW_COST=1

[env:seeed_xiao_esp32s3_camera_diag]
extends = env:seeed_xiao_esp32s3
build_flags =
	${env:seeed_xiao_esp32s3.build_flags}
	-DDESKBOT_CAMERA_DIAGNOSTICS=1
	-DDESKBOT_CAMERA_FB_COUNT=2
	-DDESKBOT_CAMERA_GRAB_LATEST=1
	-DDESKBOT_CAMERA_INIT_FRAME_SIZE=FRAMESIZE_VGA

[env:seeed_xiao_esp32s3_camera_diag_psram_dma]
extends = env:seeed_xiao_esp32s3
build_flags =
	${env:seeed_xiao_esp32s3.build_flags}
	-DDESKBOT_CAMERA_DIAGNOSTICS=1
	-DDESKBOT_CAMERA_FB_COUNT=2
	-DDESKBOT_CAMERA_GRAB_LATEST=1
	-DDESKBOT_CAMERA_INIT_FRAME_SIZE=FRAMESIZE_VGA
	-DDESKBOT_CAMERA_PSRAM_DMA=1

[env:seeed_xiao_esp32s3_camera_diag_dram]
extends = env:seeed_xiao_esp32s3
build_flags =
	${env:seeed_xiao_esp32s3.build_flags}
	-DDESKBOT_CAMERA_DIAGNOSTICS=1
	-DDESKBOT_CAMERA_FORCE_DRAM=1

[env:seeed_xiao_esp32s3_camera_diag_rgb565]
extends = env:seeed_xiao_esp32s3
build_flags =
	${env:seeed_xiao_esp32s3.build_flags}
	-DDESKBOT_CAMERA_DIAGNOSTICS=1
	-DDESKBOT_CAMERA_RGB565_JPEG=1
